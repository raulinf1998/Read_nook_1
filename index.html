<!doctype html>
<html lang="es" data-theme="calido">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#A9DDF7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bilibook — tu biblioteca y rincón de lectura: sigue tus libros, tu progreso, tus retos y tus estadísticas." />
    <script>
      // En producción, el servidor sustituye este marcador por los ajustes
      // compartidos actuales. No se lee localStorage: el primer pintado sale
      // de la misma fuente en el PC y en el teléfono.
      window.__BILIBOOK_SETTINGS__ = /* __BILIBOOK_SETTINGS__ */ null;
      try {
        var root = document.documentElement;
        var settings = window.__BILIBOOK_SETTINGS__;
        var theme = settings && typeof settings.theme === 'string' ? settings.theme : 'calido';
        var hasCustomPalette = Boolean(settings && settings.customPaletteId);
        var dark = Boolean(settings && settings.dark) || (theme === 'nocturno' && !hasCustomPalette);
        root.dataset.theme = theme;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Bilibook — Tu biblioteca y rincón de lectura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
